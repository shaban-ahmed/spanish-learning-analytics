name: Update and publish dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch current Veracity statements
        env:
          LRS_ENDPOINT: ${{ secrets.LRS_ENDPOINT }}
          LRS_KEY: ${{ secrets.LRS_KEY }}
          LRS_SECRET: ${{ secrets.LRS_SECRET }}
          LEARNER_EMAIL: ${{ secrets.LEARNER_EMAIL }}
        run: python3 scripts/sync.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
